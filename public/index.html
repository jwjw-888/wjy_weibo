.text.clamp{max-height:calc(1.65em * 6);overflow:hidden;position:relative}
.text.clamp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.65em;background:linear-gradient(transparent,var(--card))}
.rt .text.clamp::after{background:linear-gradient(transparent,var(--sunken))}
.more{display:inline-block;margin-top:2px;padding:0;border:0;background:none;color:var(--link);font:inherit;font-size:14px;cursor:pointer}
.emo{width:1.25em;height:1.25em;vertical-align:-0.22em;margin:0 1px;display:inline-block}
mark{background:#ffe27a;color:#333;border-radius:2px}
.pics{display:grid;gap:4px;margin-top:10px;grid-template-columns:repeat(3,1fr);max-width:min(100%,456px)}
.pics.n1{grid-template-columns:1fr;max-width:min(100%,300px)}
.pics.n2,.pics.n4{grid-template-columns:repeat(2,1fr);max-width:min(100%,304px)}
.pic{position:relative;padding:0;border:0;background:var(--sunken);border-radius:4px;overflow:hidden;aspect-ratio:1;cursor:zoom-in;max-width:100%}

.vnote a{color:var(--link)}

details.hot .list{display:grid;gap:10px;margin-top:10px}
.cpics{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.cpic{display:block;background:var(--line);border-radius:4px;overflow:hidden;width:96px;height:96px}

</style>

let DATA = null, filter = "all", EMO = null, LINKS = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (iso, opt) => new Intl.DateTimeFormat("zh-CN", {timeZone: TZ, ...opt}).format(new Date(iso));
const ymd = iso => fmt(iso, {year:"numeric", month:"2-digit", day:"2-digit"}).replace(/\//g, "-");
const hm = iso => fmt(iso, {hour:"2-digit", minute:"2-digit", hour12:false});
const monthKey = iso => ymd(iso).slice(0, 7);
const num = n => n >= 10000 ? (n/10000).toFixed(1).replace(/\.0$/,"") + "万" : String(n);
const dur = s => s ? `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}` : "";
// 盐圈大管家备份的那条微博（可去看视频、原图）
const backupUrl = p => (p.via && p.via.url) || p.backup || (p.video && p.video.watch) || "";
const HALF_YEAR = 183 * 864e5; // 「原微博」链接只给半年内的微博
// 备用原图：微博图床（中国连得上）。盐圈大管家备份的就是盐圈那份；吴谨言自己的用她微博的图，
// 若之后在盐圈找到同一张，会记在 p.alt，优先用盐圈的（她的微博超过半年可能看不到）。
const altUrl = p => { const u = p.alt || (p.custom ? "" : p.orig) || ""; return /sinaimg\.cn\//.test(u) ? u.replace(/^http:/, "https:").replace(/\/(orj\d+|mw\d+|thumb\d+|wap\d+)\//, "/large/") : ""; };
const origUrl = p => ORIGINAL_BASE && p.r2 !== false ? ORIGINAL_BASE + p.src : (p.orig || "");

function rich(text, q) {
  let h = esc(text || "");
  h = h.replace(/(https?:\/\/[A-Za-z0-9\-._~:\/?=&%+]+)|#([^#\n<]{1,40})#|@([\u4e00-\u9fa5\w\-]{1,30})/g, (m, url, topic, user) => {
    if (url) return `<span class="lnk">${esc((LINKS || {})[url] || "网页链接")}</span>`;
    if (topic && /\[超话\]$/.test(topic)) return `<a href="#" class="topic chao" data-topic="${topic}">${topic.replace(/\[超话\]$/, "")}超话</a>`;
    if (topic) return `<a href="#" class="topic" data-topic="${topic}">#${topic}#</a>`;
    return `<a href="https://weibo.com/n/${encodeURIComponent(user)}" target="_blank" rel="noopener noreferrer">@${user}</a>`;
  });
  if (EMO) h = h.replace(/\[([^\[\]\s<]{1,8})\]/g, (m) => EMO[m] ? `<img class="emo" src="emoji/${EMO[m]}" alt="${m}" title="${m}">` : m);
  if (q) {
    const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
    h = h.split(/(<[^>]+>)/).map(part => part.startsWith("<") ? part : part.replace(re, "<mark>$1</mark>")).join("");
  }
  return h;
}

let gallery = [];
function picsHtml(o) {
  const items = [...o.pics];
  if (o.video && !items.length && !o.skipVideo) items.push({src: o.video.cover, orig: o.video.coverOrig, isVideo: true, dur: o.video.duration, noplay: o.video.noplay, nolink: !o.video.coverOrig});
  if (!items.length) return "";
  const n = items.length;
  const cls = n === 1 ? "n1" : n === 2 ? "n2" : n === 4 ? "n4" : "";
  const start = gallery.length;
  gallery.push(items);
  const cells = items.map((p, i) => {
    const d = DATA.dims[p.src];
    const ratio = d ? d[0] / d[1] : 1;
    const ar = n === 1 && d ? ` style="aspect-ratio:${Math.max(ratio, 0.45).toFixed(4)}"` : "";
    const longPic = n === 1 && ratio < 0.45 ? '<span class="play long">长图</span>' : "";
    if (p.hide) return `<span class="pic blackout"${ar} aria-label="图片已隐藏"></span>`;
    const badge = p.isVideo && p.dur ? `<span class="play">${dur(p.dur)}</span>` : "";
    const vlink = p.isVideo ? ((o.video && o.video.watch) || (o.via && o.via.url) || "") : "";
    if (vlink) return `<a class="pic isv" href="${esc(vlink)}" target="_blank" rel="noopener noreferrer"${ar} aria-label="到微博观看视频"><img loading="lazy" decoding="async" src="thumbs/${esc(p.src)}" alt="">${badge}</a>`;
    return `<button class="pic${p.isVideo ? " isv" : ""}${p.noplay ? " noplay" : ""}" data-g="${start}" data-i="${i}"${ar} aria-label="${p.isVideo ? "视频封面" : "图片"} ${i+1}/${n}"><img loading="lazy" decoding="async" src="thumbs/${esc(p.src)}" alt="">${badge}${longPic}${p.live ? '<span class="livetag">LIVE</span>' : ""}</button>`;
  }).join("");
  const vnote = ((o.video && o.video.watch) || (o.via && o.via.url)) && items.some(p => p.isVideo) ? `<div class="vnote">点封面可到 <a href="${esc((o.video && o.video.watch) || o.via.url)}" target="_blank" rel="noopener noreferrer">@${esc(o.via.user || "盐圈大管家")}</a> 的微博观看视频</div>` : items.some(p => p.isVideo) ? `<div class="vnote">${items.some(p => !p.isVideo) ? "带播放键的是视频，" : ""}视频未存档，仅保存封面${o.video && o.video.title ? "（" + esc(o.video.title) + "）" : ""}</div>` : "";
  return `<div class="pics ${cls}${items.some(p => p.isVideo) ? " vid" : ""}">${cells}</div>${vnote}`;
}

const ICON = {
  rt: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10V8a3 3 0 0 1 3-3h11l-3-3M20 14v2a3 3 0 0 1-3 3H6l3 3"/></svg>',
  cm: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  lk: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10v10H4V10zM7 10l4-7c1.5 0 2.5 1 2.2 2.6L12.5 9H19a2 2 0 0 1 2 2.3l-1.3 7A2 2 0 0 1 17.7 20H7"/></svg>'
};
const wbTime = (iso, dateOnly) => {
  const y = ymd(iso), now = ymd(new Date().toISOString());
  const d = y.slice(0, 4) === now.slice(0, 4) ? y.slice(5) : y.slice(2);
  return dateOnly ? d : d + " " + hm(iso);
};
function postHtml(p, q) {
  const meta = [`<span>${wbTime(p.time, p.dateOnly)}</span>`];
  if (p.source) meta.push(`<span>来自 ${esc(p.source)}</span>`);
  if (p.region) meta.push(`<span>发布于 ${esc(p.region)}</span>`);
  let rt = "";
  if (p.rt) {
    const who = p.rt.url ? `<a href="${p.rt.url}" target="_blank" rel="noopener noreferrer">@${esc(p.rt.user)}</a>` : `@${esc(p.rt.user)}`;
    rt = `<div class="rt"><div class="text">${who}：${rich(p.rt.text, q)}</div>${picsHtml(p.rt)}${p.rt.time ? `<div class="rtime">${wbTime(p.rt.time)}</div>` : ""}</div>`;
  }
  const acts = p.archive ? "" : `<div class="acts"><span>${ICON.rt}${p.reposts ? num(p.reposts) : "转发"}</span><span>${ICON.cm}${p.comments ? num(p.comments) : "评论"}</span><span>${ICON.lk}${p.likes ? num(p.likes) : "赞"}</span></div>`;
  return `<article id="p-${p.id}"><div class="pbody">
    <div class="head">${p.coop ? `<div class="coava">${p.coop.map(u => u.avatar ? `<img class="mini" src="avatars/u/${esc(u.avatar)}.jpg" alt="" loading="lazy">` : `<img class="mini" src="${esc(p.avatar)}" alt="" loading="lazy">`).join("")}</div>` : p.avatar ? `<img class="mini" src="${esc(p.avatar)}" alt="" loading="lazy">` : '<div class="mini" aria-hidden="true">言</div>'}
      <div class="who"><div class="n">${p.coop ? p.coop.map(u => esc(u.name)).join('<span class="co">与</span>') + '<span class="co">的共创微博</span>' : "吴谨言"}${p.top ? '<span class="top-tag">置顶</span>' : ""}</div><div class="t">${meta.join("")}</div></div>
      ${p.url && Date.now() - Date.parse(p.time) < HALF_YEAR ? `<a class="ext" href="${p.url}" target="_blank" rel="noopener noreferrer">原微博 ↗</a>` : ""}${backupUrl(p) ? `<a class="ext" href="${esc(backupUrl(p))}" target="_blank" rel="noopener noreferrer">大管家备份 ↗</a>` : ""}</div>
    ${p.text ? `<div class="text">${rich(p.text, q)}</div>` : ""}
    ${picsHtml(p.rt && p.video && p.rt.video && p.rt.video.cover === p.video.cover ? {...p, skipVideo: true} : p)}${rt}
    ${p.note ? `<div class="vnote">注：${esc(p.note)}</div>` : ""}
    ${acts}</div>
    ${commentsHtml(p, q)}
  </article>`;
}

function cpicHtml(c) {
  const ids = c.pics || [];
  if (!ids.length) return "";
  return `<div class="cpics">${ids.map(id => `<span class="cpic"><img loading="lazy" src="thumbs/cmt/${esc(id)}.jpg" alt="评论图片"></span>`).join("")}</div>`;
}
let curAvatar = "";
function avaHtml(c, me) {
  if (me) return curAvatar ? `<img class="ava me" src="${esc(curAvatar)}" alt="" loading="lazy">` : '<div class="ava me" aria-hidden="true">言</div>';
  if (c.avatar) return `<img class="ava" src="avatars/u/${esc(c.avatar)}.jpg" alt="" loading="lazy">`;
  return `<div class="ava" aria-hidden="true">${esc((c.user || "?").slice(0, 1))}</div>`;
}
function cmtHtml(c, q, me) {
  return `<div class="cmt${me ? " mine" : ""}">${avaHtml(c, me)}<div class="c"><div class="t"><b>${esc(c.user)}</b>：${rich(c.text, q)}</div>${cpicHtml(c)}<div class="m"><span>${wbTime(c.time)}</span><span>赞 ${num(c.likes)}</span></div>`;
}
function replyHtml(r, q) {
  return `<div class="t"><b>${esc(r.user)}</b>：${rich(r.text, q)} <span class="m" style="display:inline;font-size:12px;color:var(--muted)">${wbTime(r.time)}</span></div>${cpicHtml(r)}`;
}
function commentsHtml(p, q) {
  curAvatar = p.avatar || "";
  const c = (DATA.comments || {})[p.id];
  if (!c) return "";
  let h = "";
  if (c.author.length) {
    const nRep = c.author.reduce((n, a) => n + (a.isAuthorComment ? 1 : a.replies.length), 0);
    const hit = q && c.author.some(a => [a.comment, ...a.replies].some(x => x.text.toLowerCase().includes(q.toLowerCase())));
    h += `<details class="herreply"${hit ? " open" : ""}><summary>${curAvatar ? `<img src="${esc(curAvatar)}" alt="">` : ""}<span>吴谨言回复了 ${nRep} 条评论</span><i>查看</i></summary><div class="list">` + c.author.map(a => a.isAuthorComment
      ? cmtHtml(a.comment, q, true) + "</div></div>"
      : cmtHtml(a.comment, q) + `<div class="replies">${a.replies.map(r => replyHtml(r, q)).join("")}</div></div></div>`).join("") + `</div></details>`;
  }
  if (c.top.length) {
    h += `<details class="hot"${q && c.top.some(x => x.text.toLowerCase().includes(q.toLowerCase())) ? " open" : ""}><summary>热门评论前 ${c.top.length} 名</summary><div class="list">${c.top.map(x => cmtHtml(x, q, x.uid === "1278603180") + "</div></div>").join("")}</div></details>`;
  }
  return h ? `<div class="cmts">${h}</div>` : "";
}

function haystack(p) {
  const c = (DATA.comments || {})[p.id];
  const ct = c ? [...c.top, ...c.author.flatMap(a => [a.comment, ...a.replies])].map(x => x.user + " " + x.text).join("\n") : "";
  return [p.text, p.rt && p.rt.text, p.rt && p.rt.user, p.region, p.video && p.video.title].filter(Boolean).join("\n").toLowerCase() + "\n" + ct.toLowerCase();
}

function render() {
  const q = $("q").value.trim();
  const ql = q.toLowerCase();
  const list = DATA.posts.filter(p => {
    if (MSEL.size && !MSEL.has(monthKey(p.time))) return false;
    if (filter === "orig" && p.rt) return false;
    if (filter === "rt" && !p.rt) return false;
    if (filter === "pic" && !(p.pics.some(x => !x.isVideo) || (p.rt && p.rt.pics.length))) return false;
    if (filter === "video" && !(p.video || p.pics.some(x => x.isVideo) || (p.rt && p.rt.video))) return false;
    if (filter === "reply" && !((DATA.comments || {})[p.id] && DATA.comments[p.id].author.length)) return false;
    if (ql && !haystack(p).includes(ql)) return false;
    return true;
  });
  gallery = [];
  view = {list, q, shown: 0, cur: ""};
  view.perMonth = {};
  list.forEach(p => { const k = monthKey(p.time); view.perMonth[k] = (view.perMonth[k] || 0) + 1; });
  $("feed").innerHTML = list.length ? "" : `<div class="empty">没有找到符合条件的微博</div>`;
  more();
  $("count").textContent = (q || MSEL.size || filter !== "all") ? `找到 ${list.length} 条` : `共 ${list.length} 条，按时间从新到旧`;
}
let view = null;
// 换月份、类型或搜索后，跳回列表开头，不然往下滑很远时会看到一片空白
function toTop() {
  const y = document.querySelector(".profile").offsetHeight;
  if (window.scrollY > y) window.scrollTo({top: y});
}
function clampTexts(els) {
  for (const el of els) {
    if (el.closest(".cmts")) continue;
    el.classList.add("clamp");
    if (el.scrollHeight <= el.clientHeight + 4) { el.classList.remove("clamp"); continue; }
    const b = document.createElement("button");
    b.className = "more"; b.type = "button"; b.textContent = "展开全文";
    b.addEventListener("click", () => {
      const open = el.classList.toggle("clamp");
      b.textContent = open ? "展开全文" : "收起";
      if (open) el.closest("article").scrollIntoView({block: "nearest"});
    });
    el.after(b);
  }
}
function more() {
  if (!view || view.shown >= view.list.length) return;
  let html = "";
  const end = Math.min(view.list.length, view.shown + 30);
  for (let i = view.shown; i < end; i++) {
    const p = view.list[i], k = monthKey(p.time);
    if (k !== view.cur) { view.cur = k; const [y, mo] = k.split("-"); html += `<h2 class="month">${y}年${+mo}月<small>${view.perMonth[k]} 条</small></h2>`; }
    html += postHtml(p, view.q);
  }
  view.shown = end;
  const before = $("feed").querySelectorAll(".pbody .text").length;
  $("feed").insertAdjacentHTML("beforeend", html);
  clampTexts([...$("feed").querySelectorAll(".pbody .text")].slice(before));
  $("loadmore").hidden = view.shown >= view.list.length;
}

// lightbox
let lbItems = [], lbIdx = 0;
function openLb(g, i) { lbItems = gallery[g]; lbIdx = i; showLb(); $("lb").hidden = false; document.body.style.overflow = "hidden"; $("close").focus(); }
function showLb() {
  const p = lbItems[lbIdx];
  const v = $("lbvid");
  if (p.live) { $("lbimg").hidden = true; v.hidden = false; v.poster = "thumbs/" + p.src; v.src = p.live; v.muted = true; v.play().catch(() => {}); }
  else { v.pause(); v.removeAttribute("src"); v.hidden = true; $("lbimg").hidden = false; $("lbimg").src = "thumbs/" + p.src; }
  $("lbmsg").hidden = true; $("lbalt").textContent = "备用原图";
  $("lbn").textContent = lbItems.length > 1 ? `${lbIdx + 1} / ${lbItems.length}` : "";
  $("lborig").hidden = !!p.nolink || !origUrl(p);
  $("lborig").href = origUrl(p);
  $("lborig").textContent = p.isVideo ? "查看封面原图" : "查看原图";
  const alt = altUrl(p);
  $("lbalt").hidden = true; // 微博图床防盗链，外站无法载入，先隐藏（见 README）
  $("lbalt").href = alt;
  $("prev").hidden = $("next").hidden = lbItems.length < 2;
}
function closeLb() { $("lbvid").pause(); $("lb").hidden = true; document.body.style.overflow = ""; }
function step(d) { lbIdx = (lbIdx + d + lbItems.length) % lbItems.length; showLb(); }
// 备用原图：直接在看图视窗里载入微博图床的大图（微博图床要求带来源网址，所以不另开分页）
$("lbalt").addEventListener("click", e => {
  e.preventDefault();
  const p = lbItems[lbIdx], alt = altUrl(p); if (!alt) return;
  const img = $("lbimg"), msg = $("lbmsg");
  $("lbvid").pause(); $("lbvid").hidden = true; img.hidden = false;
  msg.textContent = "备用原图载入中…"; msg.hidden = false;
  const probe = new Image(); probe.referrerPolicy = "origin";
  probe.onload = () => { if (lbItems[lbIdx] !== p) return; img.src = alt; msg.hidden = true; $("lbalt").textContent = "已显示备用原图"; };
  probe.onerror = () => { if (lbItems[lbIdx] !== p) return; msg.textContent = "备用原图暂时打不开"; };
  probe.src = alt;
});
$("close").onclick = closeLb; $("xtop").onclick = closeLb; $("prev").onclick = () => step(-1); $("next").onclick = () => step(1);
$("stage").onclick = e => { if (e.target === e.currentTarget) closeLb(); };
document.addEventListener("keydown", e => {
  if ($("lb").hidden) return;
  if (e.key === "Escape") closeLb(); else if (e.key === "ArrowLeft") step(-1); else if (e.key === "ArrowRight") step(1);
});
let tx = null;
$("stage").addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, {passive: true});
$("stage").addEventListener("touchend", e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40 && lbItems.length > 1) step(dx < 0 ? 1 : -1); tx = null; });

$("feed").addEventListener("click", e => {
  const b = e.target.closest(".pic"); if (b && b.tagName === "A") return; if (b) { openLb(+b.dataset.g, +b.dataset.i); return; }
  const t = e.target.closest("a.topic"); if (t) { e.preventDefault(); $("q").value = t.dataset.topic; render(); window.scrollTo({top: 0}); }
});
$("chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  filter = c.dataset.f;
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === c));
  render(); toTop();
});
let timer; $("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => { render(); toTop(); }, 150); });
// 月份选择：小面板（年份一排 + 12 个月格子），可复选多个月份
const MP = {years: {}, y: ""}, MSEL = new Set();
const mName = k => `${k.slice(0, 4)}年${+k.slice(5)}月`;
function mLabel() { $("mbtn").textContent = !MSEL.size ? "全部月份" : MSEL.size === 1 ? mName([...MSEL][0]) : `已选 ${MSEL.size} 个月`; }
function mDraw() {
  const ys = Object.keys(MP.years).sort().reverse();
  $("myears").innerHTML = ys.map(y => { const n = [...MSEL].filter(k => k.startsWith(y)).length; return `<button class="chip" data-y="${y}" aria-pressed="${y === MP.y}">${y}${n ? `<small>${n}</small>` : ""}</button>`; }).join("");
  const has = new Set(MP.years[MP.y] || []);
  $("mgrid").innerHTML = Array.from({length: 12}, (_, i) => { const k = `${MP.y}-${String(i + 1).padStart(2, "0")}`; return `<button data-k="${k}"${has.has(k) ? "" : " disabled"} aria-pressed="${MSEL.has(k)}">${i + 1}月</button>`; }).join("");
  const all = (MP.years[MP.y] || []).every(k => MSEL.has(k));
  $("myear").textContent = all ? "取消本年" : "全选本年";
}
function mOpen(open) {
  $("mpanel").hidden = $("mshade").hidden = !open; $("mbtn").setAttribute("aria-expanded", open);
  if (open) { MP.y = MP.y || Object.keys(MP.years).sort().pop(); mDraw(); const b = $("myears").querySelector('[aria-pressed="true"]'); if (b) b.scrollIntoView({inline: "center", block: "nearest"}); }
}
function mApply() { mLabel(); mDraw(); render(); toTop(); }
$("mbtn").addEventListener("click", e => { e.stopPropagation(); mOpen($("mpanel").hidden); });
$("myears").addEventListener("click", e => { const b = e.target.closest("[data-y]"); if (b) { MP.y = b.dataset.y; mDraw(); } });
$("mgrid").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (!b || b.disabled) return; const k = b.dataset.k; MSEL.has(k) ? MSEL.delete(k) : MSEL.add(k); mApply(); });
$("myear").addEventListener("click", () => { const ks = MP.years[MP.y] || [], all = ks.every(k => MSEL.has(k)); ks.forEach(k => all ? MSEL.delete(k) : MSEL.add(k)); mApply(); });
$("mall").addEventListener("click", () => { MSEL.clear(); mApply(); });
$("mdone").addEventListener("click", () => mOpen(false));
$("mpanel").addEventListener("click", e => e.stopPropagation());
document.addEventListener("click", () => { if (!$("mpanel").hidden) mOpen(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("mpanel").hidden) mOpen(false); });


fetch("data/all.json").then(r => r.json()).then(({d, dims, cm, emo, links}) => {
  DATA = d; DATA.dims = dims; DATA.comments = cm; EMO = emo; LINKS = links;
  if (DATA.avatar) $("pavatar").outerHTML = `<img class="avatar" src="${esc(DATA.avatar)}" alt="吴谨言头像">`;
  DATA.posts.sort((a, b) => b.time.localeCompare(a.time) || ((b.via && b.via.time) || "").localeCompare((a.via && a.via.time) || ""));
  const times = DATA.posts.map(p => p.time).sort();
  const months = [...new Set(DATA.posts.map(p => monthKey(p.time)))];
  const byYear = {};
  months.forEach(k => { const y = k.slice(0, 4); (byYear[y] = byYear[y] || []).push(k); });
  MP.years = byYear;
  new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) more(); }, {rootMargin: "800px"}).observe($("loadmore"));
  const picN = DATA.posts.reduce((a, p) => a + p.pics.filter(x => !x.isVideo).length + (p.rt ? p.rt.pics.length : 0), 0);
  $("meta").innerHTML = `<span><b>${DATA.posts.length}</b> 条微博</span><span><b>${picN}</b> 张图片</span><span>${ymd(times[0])} 至 ${ymd(times[times.length-1])}</span><span>最近备份 ${ymd(DATA.fetchedAt)}</span>`;
  render();
}).catch(() => { $("feed").innerHTML = `<div class="empty">数据载入失败，请重新整理页面</div>`; });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
