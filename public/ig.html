<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>吴谨言 IG 备份</title>
<link rel="manifest" href="manifest.webmanifest">

<style>
/* 版面仿 Instagram 个人主页：头像＋资料、分页标签、三栏（宽萤幕四栏）直式方格；点开是贴文视窗 */
:root{
  --bg:#ffffff; --card:#ffffff; --sunken:#efefef; --line:#dbdbdb; --fg:#000000; --muted:#737373; --soft:#262626;
  --link:#00376b; --tag:#00376b; --btn:#efefef; --btnh:#dbdbdb; --shade:rgba(0,0,0,.65);
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#000000; --sunken:#262626; --line:#363636; --fg:#f5f5f5; --muted:#a8a8a8; --soft:#f5f5f5;
  --link:#e0f1ff; --tag:#e0f1ff; --btn:#363636; --btnh:#262626; --shade:rgba(0,0,0,.75); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#000000; --sunken:#262626; --line:#363636; --fg:#f5f5f5; --muted:#a8a8a8; --soft:#f5f5f5;
  --link:#e0f1ff; --tag:#e0f1ff; --btn:#363636; --btnh:#262626; --shade:rgba(0,0,0,.75); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font-family:var(--body);font-size:14px;line-height:18px}
a{color:var(--link);text-decoration:none}
img{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #0095f6;outline-offset:2px}
.wrap{max-width:975px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
/* 顶部列 */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 0 0}
.back{font-size:14px;font-weight:600;color:var(--fg);background:var(--btn);border-radius:8px;padding:6px 12px}
.back:hover{background:var(--btnh)}
.langsw{display:flex;background:var(--btn);border-radius:8px;padding:3px;gap:2px}
.langsw button{font-size:12px;border:0;background:transparent;color:var(--muted);border-radius:6px;padding:3px 10px;cursor:pointer}
.langsw button[aria-pressed="true"]{background:var(--bg);color:var(--fg);font-weight:600}
/* 个人资料 */
.prof{display:grid;grid-template-columns:minmax(0,1fr) 2fr;gap:0 28px;align-items:center;padding:30px 0 44px;max-width:935px;margin:0 auto}
.av{justify-self:center;width:150px;height:150px;border-radius:50%;padding:4px;background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}
.av img,.av span{display:flex;width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid var(--bg);background:var(--sunken);align-items:center;justify-content:center;font-size:48px;color:var(--muted)}
.uname{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:20px;line-height:25px;margin-bottom:18px}
.uname a{color:var(--fg)}
.uname small{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;line-height:16px}
.igbtn{font-size:14px;font-weight:600;background:var(--btn);color:var(--fg);border-radius:8px;padding:7px 16px}
.igbtn:hover{background:var(--btnh)}
.stats{display:flex;gap:40px;font-size:16px;margin-bottom:18px}
.stats b{font-weight:600}
.fname{font-weight:600}
.bio{white-space:pre-line;margin-top:2px}
.since{color:var(--muted);font-size:12px;margin-top:6px}
.mstats{display:none}
/* 分页标签＋搜索 */
.tabs{display:flex;justify-content:center;gap:60px;border-top:1px solid var(--line);max-width:935px;margin:0 auto}
.tab{display:flex;align-items:center;gap:6px;height:52px;border:0;background:none;border-top:1px solid transparent;margin-top:-1px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:1px;cursor:pointer;text-transform:uppercase}
.tab svg{width:12px;height:12px}
.tab[aria-pressed="true"]{color:var(--fg);border-top-color:var(--fg)}
.tools{display:flex;gap:8px;max-width:935px;margin:0 auto 12px}
.tools input,.tools select{font:inherit;font-size:14px;border:0;background:var(--sunken);color:var(--fg);border-radius:8px;padding:8px 12px;min-width:0}
.tools input{flex:1}
.count{max-width:935px;margin:0 auto 8px;color:var(--muted);font-size:12px}
/* 方格 */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:1400px;margin:0 auto}
@media (max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;display:block;padding:0;border:0;background:var(--sunken);aspect-ratio:3/4;overflow:hidden;cursor:pointer}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .ico{position:absolute;top:8px;right:8px;width:20px;height:20px;color:#fff;filter:drop-shadow(0 0 2px rgba(0,0,0,.5))}
.tile .pinico{right:auto;left:8px}
.tile .ov{position:absolute;inset:0;background:rgba(0,0,0,.3);color:#fff;display:flex;align-items:center;justify-content:center;gap:28px;font-size:16px;font-weight:700;opacity:0;transition:opacity .15s}
.tile .ov span{display:flex;align-items:center;gap:6px}
.tile .ov svg{width:20px;height:20px;fill:#fff}
@media (hover:hover){.tile:hover .ov{opacity:1}}
.empty{text-align:center;color:var(--muted);padding:60px 16px}
.empty .bar{width:min(240px,70%);height:4px;border-radius:2px;background:var(--sunken);margin:14px auto 0;overflow:hidden}
.empty .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f9ce34,#ee2a7b,#6228d7);transition:width .2s}
.empty a{color:#0095f6;font-weight:600}
.loadmore{text-align:center;color:var(--muted);font-size:13px;padding:20px 0}
.note{font-size:12px;color:var(--muted);max-width:935px;margin:16px auto 40px;line-height:1.6}
mark{background:#ffe58a;color:#000;border-radius:2px}
/* 手机：资料改成 IG App 的样子 */
@media (max-width:735px){
  .wrap{padding-left:0;padding-right:0}
  .top{padding-left:16px;padding-right:16px}
  .prof{grid-template-columns:auto 1fr;gap:0 20px;padding:16px 16px 18px}
  .av{width:86px;height:86px;padding:3px}
  .av img,.av span{border-width:3px;font-size:30px}
  .uname{font-size:20px;margin-bottom:10px}
  .stats{display:none}
  .mstats{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:12px 0;text-align:center;color:var(--muted);font-size:14px}
  .mstats b{display:block;color:var(--fg);font-weight:600}
  .pbody{grid-column:1/-1;margin-top:14px}
  .tabs{gap:0;border-top:0;border-bottom:1px solid var(--line)}.tab{flex:1;justify-content:center;border-top:0;margin-top:0;border-bottom:1px solid transparent;margin-bottom:-1px}.tab[aria-pressed="true"]{border-bottom-color:var(--fg)}
  .tools{margin-top:10px}.tab span{display:none}.tab svg{width:24px;height:24px}
  .tools{padding:0 16px}.count{padding:0 16px}
  .grid{gap:2px}
  .tile .ico{width:18px;height:18px;top:6px;right:6px}
  .note{padding:0 16px}
}
/* 贴文视窗 */
.modal{position:fixed;inset:0;z-index:30;background:var(--shade);display:flex;align-items:center;justify-content:center}
.mx{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:14px;z-index:32;border:0;background:none;color:#fff;font-size:30px;line-height:1;cursor:pointer;padding:6px}
.pnav{position:fixed;top:50%;transform:translateY(-50%);z-index:32;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:#000;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.pnav.l{left:16px}.pnav.r{right:16px}
.box{display:flex;background:var(--card);max-width:calc(100vw - 140px);height:min(92vh,900px);border-radius:4px;overflow:hidden}
.media{position:relative;background:#000;display:flex;align-items:center;justify-content:center;flex:0 1 auto;min-width:0}
.media img,.media video{display:block;max-width:100%;max-height:100%;width:auto;height:100%;object-fit:contain}
.cnav{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:#000;font-size:18px;line-height:1;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.cnav.l{left:10px}.cnav.r{right:10px}
.dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:4px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45)}
.dots i.on{background:#fff}
.side{width:405px;flex:0 0 405px;display:flex;flex-direction:column;border-left:1px solid var(--line);min-height:0}
.sh{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sh img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--sunken)}
.sh .u{font-weight:600}
.sh .loc{font-size:12px;color:var(--muted)}
.sc{flex:1;overflow:auto;padding:16px;min-height:0}
.cap{display:flex;gap:12px}
.cap img{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:var(--sunken)}
.cap .t{white-space:pre-wrap;word-break:break-word;line-height:1.45}
.cap .t b{margin-right:6px}
.cap .t a{color:var(--tag)}
.cap .d{color:var(--muted);font-size:12px;margin-top:10px}
.sf{border-top:1px solid var(--line);padding:12px 16px}
.sicons{display:flex;gap:16px;align-items:center}
.sicons svg{width:24px;height:24px;fill:none;stroke:var(--fg);stroke-width:1.8}
.sicons a{margin-left:auto;font-size:13px;font-weight:600}
.likes{font-weight:600;margin-top:8px}
.when{color:var(--muted);font-size:12px;margin-top:4px}
.links{display:flex;gap:14px;margin-top:8px;font-size:12px}
/* 手机：点缩图后进入「贴文」动态，像 IG App：从点的那则开始，往下滑一直看到旧贴文，往上滑看较新的 */
.feedv{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.fbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;height:calc(44px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 8px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.fbar button{border:0;background:none;font-size:30px;line-height:1;padding:0 12px 4px 6px;cursor:pointer;color:var(--fg)}
.fbar .tt{flex:1;text-align:center;margin-right:42px;line-height:1.2}
.fbar small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.fbar b{font-size:16px}
.fp{padding-bottom:14px}
.fh{display:flex;align-items:center;gap:10px;padding:10px 12px}
.fh img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--sunken)}
.fh .u{font-weight:600}.fh .loc{font-size:12px;color:var(--fg)}
.fh .pinl{margin-left:auto;font-size:12px;color:var(--muted)}
.carw{position:relative}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:var(--sunken)}
.car::-webkit-scrollbar{display:none}
.car>div{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;position:relative}
.car img,.car video{display:block;width:100%;height:100%;object-fit:cover;background:#000}
.ccount{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;border-radius:12px;padding:2px 9px;pointer-events:none}
.fdots{display:flex;justify-content:center;gap:4px;height:6px;margin:10px 0 -4px}
.fdots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.fdots i.on{background:#0095f6}
.fa{display:flex;gap:16px;align-items:center;padding:8px 14px 0}
.fa svg{width:24px;height:24px;fill:none;stroke:var(--fg);stroke-width:1.8}
.fa .lk{margin-left:auto;display:flex;gap:14px;font-size:13px}
.fl{font-weight:600;padding:8px 14px 0}
.fc{padding:6px 14px 0;white-space:pre-wrap;word-break:break-word;line-height:1.45}
.fc b{margin-right:6px}.fc a{color:var(--tag)}
.fd{padding:6px 14px 0;color:var(--muted);font-size:12px}
.fend{text-align:center;color:var(--muted);font-size:12px;padding:20px 0 calc(30px + env(safe-area-inset-bottom,0px))}
/* 手机：贴文视窗占满整个画面，像 IG App */
@media (max-width:900px){
  .modal{background:var(--bg);align-items:stretch;overflow:auto;display:block}
  .pnav{display:none}
  .mx{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));right:8px;color:var(--fg);font-size:24px;padding:8px 10px}
  .box{flex-direction:column;max-width:none;height:auto;border-radius:0;min-height:100%}
  .sh{order:-1;border-bottom:0;padding:calc(10px + env(safe-area-inset-top,0px)) 56px 10px 14px}
  .media{width:100%;touch-action:pan-y}
  .media img,.media video{width:100%;height:auto;max-height:none}
  .dots{bottom:-18px}.dots i{background:var(--line)}.dots i.on{background:#0095f6}
  .side{width:auto;flex:none;border-left:0;display:contents}
  .sf{order:2;border-top:0;padding:24px 14px 4px}
  .sc{order:3;overflow:visible;padding:4px 14px 40px}
  .cap img{display:none}
}
</style>
</head>

<script>

let LANG = "zh"; try { if (sessionStorage.getItem("lang") === "en") LANG = "en"; } catch (e) {}
const EN = LANG === "en", T = (zh, en) => EN ? en : zh;

const fmt = (iso, opt) => { try { return new Intl.DateTimeFormat("zh-CN", Object.assign({timeZone: TZ}, opt)).format(new Date(iso)); } catch (e) { return new Date(+new Date(iso) + 8 * 3600e3).toISOString().slice(0, 16).replace("T", " "); } };

const longDate = iso => { const d = ymd(iso).split("-"); return EN ? `${MONTH_EN[+d[1] - 1]} ${+d[2]}, ${d[0]}` : `${d[0]}年${+d[1]}月${+d[2]}日`; };

document.querySelectorAll(".langsw button").forEach(b => {
  b.setAttribute("aria-pressed", b.dataset.lang === LANG);

if (EN) {

  $("back").textContent = "← Weibo archive"; $("pnt").textContent = "Fan archive"; $("igbtn").textContent = "Open Instagram"; $("fname").textContent = "Wu Jinyan";
  $("since").textContent = "Loading…"; $("t1").textContent = "Posts"; $("t2").textContent = "Videos"; $("tabs").setAttribute("aria-label", "Categories");
  $("q").placeholder = "Search IG posts"; $("yr").options[0].textContent = "All years"; $("loadmore").textContent = "Loading more…";
  $("footnote").innerHTML = "<b>This is a fan-made archive, not an official website.</b> Content comes from Wu Jinyan's Instagram; copyright of the text, images and videos belongs to Wu Jinyan. Tap a video to play it; if it won't play, tap \"Post\" to watch on Instagram. Like and comment counts are as of the time of backup.";
  $("mx").setAttribute("aria-label", "Close"); $("fback").setAttribute("aria-label", "Back"); $("pprev").setAttribute("aria-label", "Previous post"); $("pnext").setAttribute("aria-label", "Next post");
}

let D = null, LIST = [], shown = 0, PAGE = 24, tab = "all", cur = -1, ci = 0, pushed = false;
const AV = () => D.profile.avatar ? `<img src="thumbs/${esc(D.profile.avatar)}" alt="">` : `<img alt="">`;
const hasVideo = p => p.media.some(m => m.video);
function linkify(text, nq) {
  const parts = String(text).split(/([#＃][^\s#＃@]+|@[A-Za-z0-9._]+)/);
  return parts.map(s => {
    if (/^[#＃]/.test(s)) return `<a href="#" data-q="${esc(s)}">${mark(s, nq)}</a>`;
    if (/^@/.test(s)) return `<a href="https://www.instagram.com/${esc(s.slice(1))}/" target="_blank" rel="noopener noreferrer">${mark(s, nq)}</a>`;
    return mark(s, nq);
  }).join("");
}
function mark(s, nq) {
  if (!nq) return esc(s);
  const ns = norm(s); let out = "", i = 0, j;
  while ((j = ns.indexOf(nq, i)) !== -1) { out += esc(s.slice(i, j)) + "<mark>" + esc(s.slice(j, j + nq.length)) + "</mark>"; i = j + nq.length; }
  return out + esc(s.slice(i));
}
function tile(p, k) {
  const m = p.media[0], ico = p.media.length > 1 ? SV.multi : m.video ? SV.video : "";
  return `<button class="tile" data-k="${k}" aria-label="${esc(ymd(p.time))} ${esc((p.text || "").slice(0, 40))}"><img loading="lazy" decoding="async" src="thumbs/${esc(m.src)}" alt="">${ico}${p.pinned ? SV.pin : ""}<span class="ov"><span>${SV.heart}${num(p.likes)}</span><span>${SV.cmt.replace("<path", '<path fill="#fff"')}${num(p.comments)}</span></span></button>`;
}
function render() {
  const nq = norm($("q").value.trim()), y = $("yr").value;
  LIST = D.posts.filter(p => (tab !== "video" || hasVideo(p)) && (!y || ymd(p.time).startsWith(y)) && (!nq || norm(p.text).includes(nq) || norm(p.loc).includes(nq)));
  $("count").textContent = (nq || y || tab !== "all") ? T(`共 ${LIST.length} 则`, `${LIST.length} posts`) : "";
  $("grid").innerHTML = LIST.length ? "" : `<div class="empty" style="grid-column:1/-1">${T("没有符合的贴文", "No matching posts")}</div>`;
  shown = 0; more();
}
function more() {
  $("grid").insertAdjacentHTML("beforeend", LIST.slice(shown, shown + PAGE).map((p, j) => tile(p, shown + j)).join(""));
  shown = Math.min(shown + PAGE, LIST.length);
  $("loadmore").hidden = shown >= LIST.length;
}
new IntersectionObserver(es => { if (es[0].isIntersecting && D && shown < LIST.length) more(); }, {rootMargin: "1200px"}).observe($("loadmore"));
let timer; $("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(render, 150); });
$("yr").addEventListener("change", render);
$("tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (!b) return; tab = b.dataset.t; document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); });
const MOBILE = () => matchMedia("(max-width:900px)").matches;
$("grid").addEventListener("click", e => { const b = e.target.closest(".tile"); if (!b) return; MOBILE() ? openFeed(+b.dataset.k) : openPost(+b.dataset.k); });

// 手机：贴文动态
function fcard(p, k) {
  const P = D.profile, name = esc(P.username), m0 = p.media[0], n = p.media.length;
  const ar = m0.w && m0.h ? `${m0.w} / ${Math.min(m0.h, m0.w * 1.333)}` : "4 / 5";
  const slides = p.media.map((m, i) => `<div>${m.vsrc ? `<video src="${esc(ORIGINAL_BASE + m.vsrc)}" poster="thumbs/${esc(m.src)}" controls playsinline muted loop preload="none"></video>` : `<img loading="lazy" decoding="async" src="thumbs/${esc(m.src)}" alt="">`}</div>`).join("");
  const o = origUrl(m0);
  const lk = [`<a href="${esc(igPost(p))}" target="_blank" rel="noopener noreferrer">${T("原贴", "Post")} ↗</a>`];
  lk.push(m0.vsrc ? `<a class="og" href="${esc(ORIGINAL_BASE + m0.vsrc)}" target="_blank" rel="noopener noreferrer">${T("原始影片", "Original")}</a>` : `<a class="og" href="${esc(o || igPost(p))}" target="_blank" rel="noopener noreferrer">${T("原图", "Original")}</a>`);
  return `<article class="fp" data-k="${k}" id="f-${esc(p.code)}"><div class="fh">${AV()}<div><div class="u">${name}${p.coauthors && p.coauthors.length ? " · " + p.coauthors.map(u => esc(u)).join(" · ") : ""}</div>${p.loc ? `<div class="loc">${esc(p.loc)}</div>` : ""}</div>${p.pinned ? `<span class="pinl">${T("置顶", "Pinned")}</span>` : ""}</div>`
    + `<div class="carw"><div class="car" style="aspect-ratio:${ar}">${slides}</div>${n > 1 ? `<span class="ccount">1/${n}</span>` : ""}</div>`
    + (n > 1 ? `<div class="fdots">${p.media.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("")}</div>` : "")
    + `<div class="fa">${SV.heart}${SV.cmt}<span class="lk">${lk.join("")}</span></div>`
    + `<div class="fl">${T(`${num(p.likes)} 次赞 · ${num(p.comments)} 则留言`, `${num(p.likes)} likes · ${num(p.comments)} comments`)}</div>`
    + (p.text ? `<div class="fc"><b>${name}</b>${linkify(p.text, norm($("q").value.trim()))}</div>` : "")
    + `<div class="fd">${longDate(p.time)} ${hm(p.time)}</div></article>`;
}
let vio = null;
function openFeed(k) {
  $("fuser").textContent = D.profile.username;
  $("ftitle").textContent = tab === "video" ? T("视频", "Videos") : T("贴文", "Posts");
  $("flist").innerHTML = LIST.map(fcard).join("") + `<div class="fend">${T("已经到底了", "You're all caught up")}</div>`;
  $("feedv").hidden = false; document.body.style.overflow = "hidden";
  const el = $("flist").children[k]; $("feedv").scrollTop = el ? el.offsetTop - $("feedv").querySelector(".fbar").offsetHeight : 0;
  // 影片：滑到画面中间时自动静音播放，滑走就暂停（跟 IG 一样）
  if (vio) vio.disconnect();
  if ("IntersectionObserver" in window) { vio = new IntersectionObserver(es => es.forEach(e => { const v = e.target; if (e.isIntersecting && e.intersectionRatio > .6) v.play().catch(() => {}); else v.pause(); }), {root: $("feedv"), threshold: [0, .6, 1]}); $("flist").querySelectorAll("video").forEach(v => vio.observe(v)); }
  try { history.pushState({ig: 1}, "", "#" + LIST[k].code); pushed = true; } catch (e) {}
}
function closeFeed(fromPop) {
  if ($("feedv").hidden) return;
  $("feedv").hidden = true; document.body.style.overflow = ""; if (vio) vio.disconnect();
  $("flist").innerHTML = "";
  if (!fromPop && pushed) { pushed = false; history.back(); } else pushed = false;
}
$("fback").onclick = () => closeFeed();
// 左右滑多张照片时，更新 1/5 和小圆点、原图连结
$("feedv").addEventListener("scroll", e => {
  const c = e.target; if (!c.classList || !c.classList.contains("car")) return;
  const i = Math.round(c.scrollLeft / c.clientWidth), card = c.closest(".fp"), p = LIST[+card.dataset.k], m = p.media[i]; if (!m) return;
  const cc = card.querySelector(".ccount"); if (cc) cc.textContent = `${i + 1}/${p.media.length}`;
  card.querySelectorAll(".fdots i").forEach((d, j) => d.classList.toggle("on", j === i));
  const og = card.querySelector(".og"); if (og) { og.href = m.vsrc ? ORIGINAL_BASE + m.vsrc : (origUrl(m) || igPost(p)); og.textContent = m.vsrc ? T("原始影片", "Original") : T("原图", "Original"); }
}, true);
$("flist").addEventListener("click", e => { const t = e.target.closest("a[data-q]"); if (t) { e.preventDefault(); $("q").value = t.dataset.q; closeFeed(); render(); $("tools").scrollIntoView({block: "start"}); } });

// 贴文视窗
function openPost(k) {
  cur = k; ci = 0; showPost();
  if ($("modal").hidden) { $("modal").hidden = false; document.body.style.overflow = "hidden"; try { history.pushState({ig: 1}, "", "#" + LIST[k].code); pushed = true; } catch (e) {} }
  else { try { history.replaceState({ig: 1}, "", "#" + LIST[k].code); } catch (e) {} }
}
function showPost() {
  const p = LIST[cur], nq = norm($("q").value.trim()), P = D.profile, name = esc(P.username);
  $("sh").innerHTML = `${AV()}<div><div class="u">${name}${p.coauthors && p.coauthors.length ? " · " + p.coauthors.map(u => esc(u)).join(" · ") : ""}</div>${p.loc ? `<div class="loc">${esc(p.loc)}</div>` : ""}</div>`;
  $("sc").innerHTML = p.text ? `<div class="cap">${AV()}<div><div class="t"><b>${name}</b>${linkify(p.text, nq)}</div><div class="d">${longDate(p.time)} ${hm(p.time)}</div></div></div>` : "";
  $("pprev").hidden = cur <= 0; $("pnext").hidden = cur >= LIST.length - 1;
  showMedia();
}
function showMedia() {
  const p = LIST[cur], m = p.media[ci], n = p.media.length;
  const old = $("media").querySelector("video"); if (old) old.pause();
  let h;
  if (m.vsrc) h = `<video src="${esc(ORIGINAL_BASE + m.vsrc)}" poster="thumbs/${esc(m.src)}" controls playsinline autoplay preload="metadata"></video>`;
  else h = `<img src="thumbs/${esc(m.src)}" alt="">`;
  if (n > 1) h += (ci > 0 ? `<button class="cnav l" data-d="-1" aria-label="${T("上一张", "Previous")}">‹</button>` : "") + (ci < n - 1 ? `<button class="cnav r" data-d="1" aria-label="${T("下一张", "Next")}">›</button>` : "") + `<div class="dots">${p.media.map((_, i) => `<i class="${i === ci ? "on" : ""}"></i>`).join("")}</div>`;
  $("media").innerHTML = h;
  if (m.w && m.h) $("media").style.aspectRatio = `${m.w} / ${m.h}`; else $("media").style.aspectRatio = "";
  const im = $("media").querySelector("img"), o = origUrl(m);
  if (im && o) { const big = new Image(); big.onload = () => { if (LIST[cur] === p && p.media[ci] === m) im.src = o; }; big.src = o; }
  const links = [`<a href="${esc(igPost(p))}" target="_blank" rel="noopener noreferrer">${T("原贴", "Post")} ↗</a>`];
  if (m.vsrc) links.push(`<a href="${esc(ORIGINAL_BASE + m.vsrc)}" target="_blank" rel="noopener noreferrer">${T("原始影片", "Original video")}</a>`);
  else if (o) links.push(`<a href="${esc(o)}" target="_blank" rel="noopener noreferrer">${T("查看原图", "Original image")}</a>`);
  if (m.video && !m.vsrc) links.push(`<a href="${esc(igPost(p))}" target="_blank" rel="noopener noreferrer">${T("到 IG 观看视频", "Watch on IG")}</a>`);
  $("sf").innerHTML = `<div class="sicons">${SV.heart}${SV.cmt}</div><div class="likes">${T(`${num(p.likes)} 次赞`, `${num(p.likes)} likes`)} · ${T(`${num(p.comments)} 则留言`, `${num(p.comments)} comments`)}</div><div class="when">${longDate(p.time)}</div><div class="links">${links.join("")}</div>`;
}
const stepImg = d => { const n = LIST[cur].media.length; const j = ci + d; if (j < 0 || j >= n) return false; ci = j; showMedia(); return true; };
const stepPost = d => { const j = cur + d; if (j < 0 || j >= LIST.length) return; if (j >= shown) more(); openPost(j); };
function closePost(fromPop) {
  if ($("modal").hidden) return;
  const v = $("media").querySelector("video"); if (v) v.pause();
  $("modal").hidden = true; $("media").innerHTML = ""; document.body.style.overflow = "";
  if (!fromPop && pushed) { pushed = false; history.back(); } else pushed = false;
}
window.addEventListener("popstate", () => { closePost(true); closeFeed(true); });
$("mx").onclick = () => closePost(); $("pprev").onclick = () => stepPost(-1); $("pnext").onclick = () => stepPost(1);
$("modal").addEventListener("click", e => {
  if (e.target === $("modal")) return closePost();
  const c = e.target.closest(".cnav"); if (c) { stepImg(+c.dataset.d); return; }
  const t = e.target.closest("a[data-q]"); if (t) { e.preventDefault(); $("q").value = t.dataset.q; closePost(); render(); $("tools").scrollIntoView({block: "start"}); }
});
document.addEventListener("keydown", e => {
  if ($("modal").hidden) return;
  if (e.key === "Escape") closePost();
  if (e.key === "ArrowLeft" && !stepImg(-1)) stepPost(-1);
  if (e.key === "ArrowRight" && !stepImg(1)) stepPost(1);
});
let sx = null, sy = 0;
$("media").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive: true});
$("media").addEventListener("touchend", e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) stepImg(dx < 0 ? 1 : -1); sx = null; });

// 下载资料（跟微博备份一样）：显示下载百分比；网路卡住（30 秒没收到资料）才中断重试，最多重试 2 次
const SIZE = (() => { try { return +document.querySelector('meta[name="data-size"]').content || 0; } catch (e) { return 0; } })();
function ldShow(got) {
  const el = $("ld"); if (!el) return;
  const pc = SIZE && got ? Math.min(99, Math.floor(got * 100 / SIZE)) : 0;
  el.innerHTML = T("资料载入中", "Loading") + (pc ? T(`（${pc}%）`, ` (${pc}%)`) : "") + T("，网路较慢时请稍候…", " — please wait on slow connections…") + `<div class="bar"><i style="width:${pc}%"></i></div>`;
}
ldShow(0);
const getJSON = (u, n = 2, ms = 30000, prog) => {
  const ac = typeof AbortController === "function" ? new AbortController() : null;
  let t = 0; const arm = () => { clearTimeout(t); if (ac) t = setTimeout(() => ac.abort(), ms); };
  arm();
  return fetch(u, Object.assign(n < 2 ? {cache: "reload"} : {}, ac ? {signal: ac.signal} : {}))
    .then(r => {
      if (!r.ok) throw new Error(r.status);
      if (!r.body || !r.body.getReader || typeof TextDecoder !== "function") return r.json();
      const rd = r.body.getReader(), parts = []; let got = 0;
      const pump = () => rd.read().then(({done, value}) => {
        if (done) { const all = new Uint8Array(got); let o = 0; parts.forEach(x => { all.set(x, o); o += x.length; }); return JSON.parse(new TextDecoder().decode(all)); }
        arm(); parts.push(value); got += value.length; if (prog) try { prog(got); } catch (e) {}
        return pump();
      });
      return pump();
    })
    .then(j => { clearTimeout(t); return j; }, e => { clearTimeout(t); throw e; })
    .catch(e => n > 0 ? new Promise(ok => setTimeout(ok, 1500)).then(() => { if (prog) prog(0); return getJSON(u, n - 1, ms * 1.5, prog); }) : Promise.reject(e));
};
getJSON("data/ig.json", 2, 30000, ldShow).then(d => {
  D = d; D.posts.sort((a, b) => (!!b.pinned - !!a.pinned) || (a.time < b.time ? 1 : -1));
  const P = D.profile, url = `https://www.instagram.com/${encodeURIComponent(P.username)}/`;
  if (P.avatar) $("pav").outerHTML = `<img src="thumbs/${esc(P.avatar)}" alt="">`;
  $("uname").textContent = P.username; $("uname").href = url; $("igbtn").href = url;
  $("fname").textContent = EN ? "Wu Jinyan" : (P.full_name || "吴谨言");
  $("bio").textContent = P.bio || "";
  const imgs = D.posts.reduce((s, p) => s + p.media.filter(m => !m.video).length, 0), vids = D.posts.reduce((s, p) => s + p.media.filter(m => m.video).length, 0);
  const st = [[D.posts.length, T("贴文", "posts")], [imgs, T("图片", "photos")], [vids, T("视频", "videos")]];
  $("stats").innerHTML = st.map(([n, l]) => `<span><b>${n}</b> ${l}</span>`).join("");
  $("mstats").innerHTML = st.map(([n, l]) => `<span><b>${n}</b>${l}</span>`).join("");
  const t = D.posts.map(p => p.time).sort();
  $("since").textContent = (t.length ? `${ymd(t[0])} – ${ymd(t[t.length - 1])} · ` : "") + T("备份于 ", "Backed up ") + ymd(D.at);
  const years = [...new Set(D.posts.map(p => ymd(p.time).slice(0, 4)))].sort().reverse();
  $("yr").insertAdjacentHTML("beforeend", years.map(y => `<option value="${y}">${EN ? y : y + "年"}</option>`).join(""));
  $("tools").hidden = false; render();
  // 网址带 #贴文代码 时直接打开那则
  const h = location.hash.slice(1); if (h) { const k = LIST.findIndex(p => p.code === h); if (k >= 0) { if (MOBILE()) { openFeed(k); } else { while (k >= shown) more(); cur = k; ci = 0; showPost(); $("modal").hidden = false; document.body.style.overflow = "hidden"; } } }
}).catch(() => {
  $("since").textContent = "";
  $("grid").innerHTML = `<div class="empty" style="grid-column:1/-1">${T("网路较慢，资料载入失败，请", "Slow connection — loading failed. Please ")}<a href="#" onclick="location.reload();return false">${T("重新整理", "refresh")}</a>${T("再试一次", " and try again")}</div>`;
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
